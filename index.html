<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Freela | Operação e Escala</title>
    <style>
        :root {
            --bg-color: #FFFFFF;
            --text-dark: #1A1A1A;
            --primary-blue: #005bb5;
            --secondary-blue: #007AFF;
            --alert-yellow: #FFCC00;
            --gold-orange: #FF9900;
            --card-bg: #F8F9FA;
            --border-color: #E0E0E0;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background: var(--bg-color); color: var(--text-dark);
            font-family: -apple-system, "SF Pro Display", "Roboto", sans-serif;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; user-select: none;
        }

        .app-container {
            width: 400px; height: 850px;
            background: var(--bg-color);
            border: 1px solid var(--border-color); border-radius: 40px;
            position: relative; overflow-y: auto; box-shadow: var(--shadow);
            display: flex; flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            padding: 40px 25px 25px; color: #FFF; border-radius: 40px 40px 0 0;
            text-align: center;
        }

        .status-badge {
            background: var(--alert-yellow); color: var(--text-dark);
            padding: 5px 15px; border-radius: 20px; font-size: 10px; font-weight: 800;
            display: inline-block; margin-bottom: 10px; letter-spacing: 1px;
        }

        .finance-card {
            background: #FFF; margin: -20px 20px 20px; padding: 25px;
            border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
            text-align: center; position: relative; z-index: 10;
        }

        .balance-value { font-size: 38px; font-weight: 900; color: var(--text-dark); margin: 5px 0; }
        .clt-info { font-size: 11px; color: #666; font-weight: 500; }

        .module-title { font-size: 14px; font-weight: 800; margin: 0 25px 10px; color: var(--primary-blue); text-transform: uppercase; }

        /* Tabela de Escala Justa */
        .roster-list { margin: 0 20px; display: flex; flex-direction: column; gap: 10px; }
        .roster-item {
            background: var(--card-bg); padding: 15px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--primary-blue);
        }
        .roster-item.priority { border-left-color: var(--gold-orange); background: #FFF9E6; }
        .worker-info h4 { margin: 0; font-size: 14px; color: var(--text-dark); }
        .worker-info p { margin: 2px 0 0; font-size: 10px; color: #666; }
        .worker-status { font-size: 12px; font-weight: bold; color: var(--gold-orange); }

        .btn-action {
            background: var(--gold-orange); color: #FFF; border: none;
            padding: 18px; border-radius: 25px; font-weight: 900; font-size: 14px;
            margin: 20px; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 153, 0, 0.4);
        }
        .btn-action:hover { background: #e68a00; }
        
        .btn-pix {
            background: var(--secondary-blue); margin-top: 0;
            box-shadow: 0 5px 15px rgba(0, 122, 255, 0.3);
        }

        /* Ocultar barra de rolagem */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="status-badge">SISTEMA ATIVO | Freela |</div>
        <h2 style="margin: 0; font-weight: 300;">Gestão Operacional</h2>
    </div>

    <div class="finance-card">
        <div class="clt-info">VALOR AGREGADO (BASE CLT + DSR)</div>
        <div class="balance-value" id="current-value">R$ 0,00</div>
        <div class="clt-info" id="time-worked">00h 00m 00s Trabalhados</div>
    </div>

    <div class="module-title">Escala de Oportunidade (Algoritmo Justo)</div>
    <div class="roster-list" id="roster-container">
        <!-- Injetado via JS garantindo dados automáticos e precisos -->
    </div>

    <div style="flex-grow: 1;"></div>

    <button class="btn-action" id="work-btn" onclick="toggleShift()">INICIAR TURNO (BATER PONTO)</button>
    <button class="btn-action btn-pix" onclick="generatePix()">GERAR COBRANÇA PIX REAL</button>
</div>

<!-- ========================================== -->
<!-- PROTOCOLO ALADDIN: BLINDAGEM FRONT-END     -->
<!-- ========================================== -->
<script>
(() => {
    // 1. Bloqueio de Contexto e Seleção
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());

    // 2. Interceptação de Atalhos (F12, Ctrl+U, etc)
    document.addEventListener('keydown', e => {
        if (
            e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
        ) {
            e.preventDefault();
            console.error("🔒 Protocolo Aladdin Ativado: Acesso de inspeção negado.");
            return false;
        }
    });

    // 3. Armadilha de Debugger (Desacelera engenharia reversa básica)
    setInterval(() => {
        const before = new Date().getTime();
        debugger; 
        const after = new Date().getTime();
        if (after - before > 100) {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50%;'>SISTEMA BLOQUEADO.</h1>";
        }
    }, 2000);
})();
</script>

<!-- ========================================== -->
<!-- LÓGICA DE NEGÓCIO E ALGORITMO JUSTO        -->
<!-- ========================================== -->
<script>
    // Configurações CLT / Valor
    const valorHoraCLT = 45.00; // Base hora + DSR + Proporcional
    let isWorking = false;
    let secondsWorked = 0;
    let timerInterval;

    // Simulação de Banco de Dados de Freelancers (Estrutura rígida para integrar via API)
    // O algoritmo prioriza quem tem 'rendaSemanal' igual a 0.
    const databaseFreelancers = [
        { cpf: "040.370.961-02", nome: "Mikaele N.", funcao: "Garçonete", rendaSemanal: 0 },
        { cpf: "3422.599.988-54", nome: "Cristian Florencio", funcao: "Garçom", rendaSemanal: 450.00 },
        { cpf: "***.456.789-**", nome: "Ana Costa", funcao: "Garçonete", rendaSemanal: 0 },
        { cpf: "***.321.654-**", nome: "Carlos M.", funcao: "Logística", rendaSemanal: 120.00 }
    ];

    function renderRoster() {
        const container = document.getElementById('roster-container');
        container.innerHTML = "";

        // Ordena: Prioridade para quem tem renda R$ 0,00 na semana
        const sortedRoster = databaseFreelancers.sort((a, b) => a.rendaSemanal - b.rendaSemanal);

        sortedRoster.forEach(worker => {
            const isPriority = worker.rendaSemanal === 0;
            const div = document.createElement('div');
            div.className = `roster-item ${isPriority ? 'priority' : ''}`;
            
            div.innerHTML = `
                <div class="worker-info">
                    <h4>${worker.nome} ${isPriority ? '⭐' : ''}</h4>
                    <p>CPF: ${worker.cpf} | Função: ${worker.funcao}</p>
                    <p>Renda Semanal: R$ ${worker.rendaSemanal.toFixed(2)}</p>
                </div>
                <div class="worker-status">
                    ${isPriority ? 'PRIORIDADE' : 'ESCALADO'}
                </div>
            `;
            container.appendChild(div);
        });
    }

    function toggleShift() {
        const btn = document.getElementById('work-btn');
        if (!isWorking) {
            isWorking = true;
            btn.innerText = "PAUSAR TURNO";
            btn.style.background = "#FF3B30"; // Vermelho
            btn.style.boxShadow = "0 5px 15px rgba(255, 59, 48, 0.4)";
            timerInterval = setInterval(updateTimeAndValue, 1000);
        } else {
            isWorking = false;
            btn.innerText = "RETOMAR TURNO";
            btn.style.background = "var(--gold-orange)";
            btn.style.boxShadow = "0 5px 15px rgba(255, 153, 0, 0.4)";
            clearInterval(timerInterval);
        }
    }

    function updateTimeAndValue() {
        secondsWorked++;
        const value = (secondsWorked / 3600) * valorHoraCLT;
        
        // Formatar Moeda
        document.getElementById('current-value').innerText = `R$ ${value.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        
        // Formatar Tempo
        const h = Math.floor(secondsWorked / 3600).toString().padStart(2, '0');
        const m = Math.floor((secondsWorked % 3600) / 60).toString().padStart(2, '0');
        const s = (secondsWorked % 60).toString().padStart(2, '0');
        document.getElementById('time-worked').innerText = `${h}h ${m}m ${s}s Trabalhados`;
    }

    function generatePix() {
        const value = (secondsWorked / 3600) * valorHoraCLT;
        if (value <= 0) {
            alert("Nenhum valor agregado ainda. Inicie o turno.");
            return;
        }
        // Aqui entra a integração com Gateway de Pagamento (Mercado Pago, Gerencianet)
        alert(`Integração de API necessária.\nChamando endpoint de cobrança para gerar QR Code PIX (Copia e Cola) no valor de R$ ${value.toFixed(2)}...`);
    }

    // Inicializar painel
    renderRoster();

</script>
</body>
</html>

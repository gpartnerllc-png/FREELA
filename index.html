<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREELAS | Operação Full Scale</title>
    <style>
        :root {
            --primary-blue: #0047AB;
            --secondary-blue: #007AFF;
            --gold-orange: #FF9900;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-dark: rgba(0, 0, 0, 0.8);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: "SF Pro Display", sans-serif;
            background: #000; overflow: hidden;
        }

        /* FUNDO COM IMAGEM E SOBREPOSIÇÃO AZUL */
        .bg-layer {
            position: fixed; inset: 0; z-index: -2;
            background: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?q=80&w=1920') no-repeat center center;
            background-size: cover;
            filter: brightness(0.4);
        }

        .blue-gradient {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(180deg, rgba(0, 71, 171, 0.5) 0%, rgba(0, 0, 0, 0.8) 100%);
        }

        /* LOGIN 3D */
        #auth-screen {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2);
            text-align: center; color: #FFF; width: 320px;
        }

        /* DASHBOARD LATERALIZADO */
        #main-app { display: none; padding: 20px; height: 100vh; color: #FFF; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .main-layout { display: flex; gap: 20px; height: calc(100% - 150px); }

        /* PAINEL ESQUERDO: FINANCEIRO */
        .left-panel { flex: 1.5; display: flex; flex-direction: column; gap: 15px; }
        
        .finance-card {
            background: #FFF; color: #000; border-radius: 20px; padding: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .val-total { font-size: 40px; font-weight: 900; margin: 10px 0; }

        .transport-box {
            background: rgba(255,255,255,0.1); border: 1px dashed #FFF;
            padding: 15px; border-radius: 15px;
        }

        /* PAINEL DIREITO: ESCALA (ESTILO ESTAFF) */
        .right-panel { flex: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 20px; padding: 15px; }
        
        .worker-card {
            background: #FFF; color: #000; padding: 12px; border-radius: 12px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; border-left: 5px solid #ccc;
        }
        .worker-card.active { border-left-color: #4CD964; background: #f0fff0; }
        .worker-card.priority { border-left-color: var(--gold-orange); }

        /* FOOTER */
        .footer-actions {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            display: flex; gap: 15px;
        }
        .btn {
            flex: 1; padding: 20px; border-radius: 15px; border: none;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
        }

        input { width: 100%; padding: 12px; border-radius: 10px; border: none; margin: 10px 0; text-align: center; }
    </style>
</head>
<body>

<div class="bg-layer"></div>
<div class="blue-gradient"></div>

<div id="auth-screen">
    <div class="login-card">
        <h2 style="margin:0">FREELA</h2>
        <p style="font-size:10px; letter-spacing:2px">SISTEMA DE ESCALA GIG</p>
        <input type="tel" id="cpf-input" placeholder="000.000.000-00">
        <button class="btn" style="background:var(--gold-orange); color:#000; width:100%" onclick="login()">ENTRAR</button>
        <p id="msg-erro" style="color:red; font-size:11px; display:none; margin-top:10px">CPF não cadastrado na Receita/Escala</p>
    </div>
</div>

<div id="main-app">
    <div class="top-bar">
        <div>
            <small id="user-id">ID: 00000000000</small>
            <h3 id="user-name" style="margin:0; color:var(--gold-orange)">Nome do Freela</h3>
        </div>
        <div id="real-clock" style="font-family:monospace; background:rgba(255,255,255,0.2); padding:5px 15px; border-radius:20px">00:00:00</div>
    </div>

    <div class="main-layout">
        <!-- LADO ESQUERDO -->
        <div class="left-panel">
            <div class="finance-card">
                <small style="font-weight:bold; color:#666">AGREGADO REAL (CLT+DSR)</small>
                <div class="val-total" id="current-val">R$ 0,00</div>
                <div id="timer-display" style="color:var(--secondary-blue); font-weight:bold">00:00:00 TRABALHADO</div>
            </div>

            <div class="transport-box">
                <small>VALOR TRANSPORTE FIXO</small>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px">
                    <span>R$</span>
                    <input type="number" id="val-transp" value="24.00" style="margin:0; width:80px; background:transparent; color:#FFF; border-bottom:1px solid #FFF">
                </div>
            </div>
            
            <div style="font-size:12px; color:rgba(255,255,255,0.7)">
                * Validação via Base SandxCDD / Sinais de Operação Ativa
            </div>
        </div>

        <!-- LADO DIREITO (ESCALA) -->
        <div class="right-panel">
            <small style="font-weight:bold; display:block; margin-bottom:10px">ESCALA ATIVA (ESTAFF MODE)</small>
            <div id="roster-list"></div>
        </div>
    </div>

    <div class="footer-actions">
        <button class="btn" id="btn-shift" onclick="toggleShift()" style="background:#FFF">INICIAR TURNO</button>
        <button class="btn" onclick="gerarPix()" style="background:var(--secondary-blue); color:#FFF">GERAR PIX</button>
    </div>
</div>

<script>
    const db = [
        { cpf: "34259998854", nome: "Cristian R.", transp: 24.00, renda: 450, cargo: "Estrategista" },
        { cpf: "04037096102", nome: "Mikaele N.", transp: 24.00, renda: 0, cargo: "Garçonete" },
        { cpf: "12345678900", nome: "Ana Costa", transp: 24.00, renda: 0, cargo: "Logística" }
    ];

    let user = null, isWorking = false, sec = 0, timer, totalGeral = 0;

    // Relógio em tempo real
    setInterval(() => {
        const now = new Date();
        document.getElementById('real-clock').innerText = now.toLocaleTimeString();
    }, 1000);

    function login() {
        const cpf = document.getElementById('cpf-input').value.replace(/\D/g, '');
        user = db.find(u => u.cpf === cpf);
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('user-name').innerText = user.nome;
            document.getElementById('user-id').innerText = `ID: ${user.cpf}`;
            document.getElementById('val-transp').value = user.transp.toFixed(2);
            renderRoster();
        } else {
            document.getElementById('msg-erro').style.display = 'block';
        }
    }

    function renderRoster() {
        const list = document.getElementById('roster-list');
        list.innerHTML = db.map(u => `
            <div class="worker-card ${u.cpf === user.cpf && isWorking ? 'active' : (u.renda === 0 ? 'priority' : '')}">
                <div>
                    <b>${u.nome}</b><br>
                    <small>${u.cargo}</small>
                </div>
                <div style="text-align:right">
                    <small>${u.renda === 0 ? 'PRIORIDADE' : 'DISPONÍVEL'}</small><br>
                    <b>R$ ${u.renda.toFixed(2)}</b>
                </div>
            </div>
        `).join('');
    }

    function toggleShift() {
        const btn = document.getElementById('btn-shift');
        if(!isWorking) {
            isWorking = true;
            btn.innerText = "PARAR TURNO";
            btn.style.background = "#FF3B30"; btn.style.color = "#FFF";
            timer = setInterval(() => {
                sec++;
                totalGeral = (sec / 3600) * 45.00; // Valor CLT
                document.getElementById('current-val').innerText = `R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits:3})}`;
                const h = Math.floor(sec/3600).toString().padStart(2,'0');
                const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
                const s = (sec%60).toString().padStart(2,'0');
                document.getElementById('timer-display').innerText = `${h}:${m}:${s} TRABALHADO`;
            }, 1000);
        } else {
            isWorking = false;
            btn.innerText = "RETOMAR TURNO";
            btn.style.background = "#FFF"; btn.style.color = "#000";
            clearInterval(timer);
        }
        renderRoster();
    }

    function gerarPix() {
        const tr = parseFloat(document.getElementById('val-transp').value) || 0;
        const final = totalGeral + tr;
        if(totalGeral <= 0) return alert("Turno não iniciado.");
        
        alert(`GERANDO COBRANÇA PIX (SandxCDD)\n--------------------------\nBase: R$ ${totalGeral.toFixed(2)}\nTransporte: R$ ${tr.toFixed(2)}\nTOTAL: R$ ${final.toFixed(2)}\n\nStatus: Enviado para validação do empregador.`);
    }
</script>
</body>
</html>

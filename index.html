<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-PARTNER | Full Scale Security</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --apple-glass: rgba(255, 255, 255, 0.4);
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --vibrant-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* Bloqueio visual de seleção */
        * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        input { -webkit-user-select: text; user-select: text; }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            background: radial-gradient(circle at top left, #1a1a2e, #16213e, #0f3460);
            background-attachment: fixed;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* --- TELA DE LOGIN --- */
        #auth-screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(25px);
        }
        .login-card {
            background: var(--apple-glass);
            padding: 50px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2);
            text-align: center; width: 350px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .login-card input {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            margin: 20px 0; text-align: center; font-size: 18px; outline: none;
            background: rgba(255,255,255,0.8);
        }

        /* --- DASHBOARD --- */
        #main-app { 
            display: none; width: 100%; max-width: 1200px; 
            padding: 15px; box-sizing: border-box; opacity: 0; transition: opacity 0.5s;
        }

        .glass-container {
            background: var(--apple-glass);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; 
            padding: 20px; gap: 20px;
            min-height: 85vh; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.8);
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .user-pill { background: #FFF; padding: 8px 15px; border-radius: 50px; display: flex; align-items: center; gap: 10px; }
        .status-badge { background: var(--google-green); color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; }

        .main-content { display: flex; flex-direction: column; gap: 15px; flex: 1; }
        @media (min-width: 768px) { .main-content { flex-direction: row; } }

        .card-finance {
            flex: 1.5; background: #FFF; border-radius: 25px; padding: 25px;
            display: flex; flex-direction: column; justify-content: center; text-align: center;
        }

        .value-display { font-size: clamp(40px, 8vw, 64px); font-weight: 800; color: #1d1d1f; letter-spacing: -2px; }

        .sidebar { flex: 1; background: rgba(0,0,0,0.2); border-radius: 25px; padding: 15px; overflow-y: auto; }
        .worker-item { background: rgba(255,255,255,0.9); margin-bottom: 10px; padding: 12px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }

        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .btn-main { flex: 1; padding: 18px 10px; border-radius: 18px; border: none; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-tesla { background: #000; color: #FFF; }
        .btn-google { background: var(--google-blue); color: #FFF; }

        #pix-modal {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .pix-card { background: #FFF; padding: 30px; border-radius: 30px; text-align: center; width: 100%; max-width: 320px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="auth-screen">
    <div class="login-card">
        <div style="background: #000; color: #fff; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 10px;">AES-256 MILITARY GRADE ENCRYPTION ACTIVE</div>
        <h1 style="margin:0; font-size: 24px; color: #fff;">X-PARTNER</h1>
        <p style="font-size: 12px; letter-spacing: 2px; color: #fff;">SECURITY PROTOCOL: ALADIN</p>
        <input type="tel" id="cpf-input" placeholder="CPF do Operador" autocomplete="off">
        <button class="btn-main btn-tesla" style="width: 100%; padding: 20px; font-size: 16px;" onclick="validateAccess()">DESCRIPTOGRAFAR ACESSO</button>
        <p id="msg-erro" style="color:#ff4d4d; font-size:12px; display:none; margin-top:15px; font-weight: bold;">ACESSO NEGADO: CREDENCIAIS INVÁLIDAS</p>
    </div>
</div>

<div id="main-app">
    <div class="glass-container">
        <div class="header">
            <div class="user-pill">
                <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--vibrant-gradient)"></div>
                <div><strong id="logged-name" style="font-size: 14px;">---</strong></div>
            </div>
            <div style="text-align: right; color: white;">
                <div class="status-badge" id="status-label">SISTEMA SEGURO</div>
                <h3 id="clock" style="margin: 2px 0; font-family: monospace;">00:00:00</h3>
            </div>
        </div>

        <div class="main-content">
            <div class="card-finance">
                <span style="color: var(--google-blue); font-size: 12px; font-weight: bold;">VALOR ACUMULADO (PRODUÇÃO)</span>
                <div class="value-display" id="total-val">R$ 0,000</div>
                <div id="timer" style="font-size: 16px; color: #888; font-weight: bold;">00:00:00 EM OPERAÇÃO</div>
                
                <div style="margin-top: 20px; padding: 15px; background: #f5f5f7; border-radius: 15px;">
                    <label style="font-size: 10px; color: #666; font-weight: bold; display: block;">ADICIONAL TRANSPORTE (R$)</label>
                    <input type="number" id="inp-transp" value="24.00" style="border:none; background:transparent; font-size:20px; font-weight:bold; text-align:center; width: 80px;">
                </div>
            </div>
            <div class="sidebar" id="roster"></div>
        </div>

        <div class="btn-group">
            <button class="btn-main btn-tesla" id="btn-action" onclick="toggleShift()">INICIAR TURNO</button>
            <button class="btn-main btn-google" onclick="generateSecurePix()">SOLICITAR PAGAMENTO (PIX)</button>
        </div>
    </div>
</div>

<div id="pix-modal">
    <div class="pix-card">
        <h3 style="margin-top:0">PIX DE TRANSFERÊNCIA</h3>
        <div id="qrcode" style="display: flex; justify-content: center; margin: 15px 0;"></div>
        <p id="pix-details" style="font-size: 12px; color: #444; word-break: break-all; background: #eee; padding: 10px; border-radius: 10px;"></p>
        <button class="btn-main btn-tesla" style="width: 100%" onclick="document.getElementById('pix-modal').style.display='none'">FECHAR RECIBO</button>
    </div>
</div>

<script>
    /* --- BANCO DE DADOS PROTEGIDO COM CHAVES PIX INDIVIDUAIS --- */
    const _0xAlpha = [
        { c: "34259998854", n: "Cristian R.", g: "Estrategista", pix: "34259998854", a: false },
        { c: "04037096102", n: "Mikaele N.", g: "Garçonete", pix: "mika@droppfy.com", a: false },
        { c: "12345678900", n: "Ana Costa", g: "Logística", pix: "ana_financas@banco.com", a: false }
    ];

    let sessionActive = false, seconds = 0, timerInterval = null, currentUser = null;

    /* --- PROTOCOLO ALADIN: SEGURANÇA CONTRA HACKERS --- */
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
            alert("PROTOCOLO DE SEGURANÇA ATIVO: Ação Bloqueada.");
            return false;
        }
    };

    function validateAccess() {
        const input = document.getElementById('cpf-input').value.replace(/\D/g, '');
        currentUser = _0xAlpha.find(u => u.c === input);
        
        if(currentUser) {
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('main-app').style.opacity = '1';
                document.getElementById('logged-name').innerText = currentUser.n;
                renderRoster();
            }, 500);
        } else {
            document.getElementById('msg-erro').style.display = 'block';
        }
    }

    function renderRoster() {
        const roster = document.getElementById('roster');
        roster.innerHTML = _0xAlpha.map(p => `
            <div class="worker-item">
                <div style="font-size: 13px;"><strong>${p.n}</strong><br><small style="color: #666">${p.g}</small></div>
                <div style="width: 12px; height: 12px; border-radius: 50%; background: ${p.a ? '#34A853' : '#ea4335'}; box-shadow: 0 0 10px ${p.a ? '#34A853' : '#ea4335'}"></div>
            </div>
        `).join('');
    }

    function toggleShift() {
        sessionActive = !sessionActive;
        const btn = document.getElementById('btn-action');
        const status = document.getElementById('status-label');
        currentUser.a = sessionActive;
        
        if(sessionActive) {
            btn.innerText = "PARAR OPERAÇÃO"; btn.style.background = "#EA4335";
            status.innerText = "CONECTADO / OPERANDO";
            timerInterval = setInterval(() => {
                seconds++;
                let val = (seconds / 3600) * 45; 
                document.getElementById('total-val').innerText = `R$ ${val.toLocaleString('pt-BR', {minimumFractionDigits:3})}`;
                const h = Math.floor(seconds/3600).toString().padStart(2,'0');
                const m = Math.floor((seconds%3600)/60).toString().padStart(2,'0');
                const s = (seconds%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${s} EM OPERAÇÃO`;
            }, 1000);
        } else {
            btn.innerText = "RETOMAR OPERAÇÃO"; btn.style.background = "#000";
            status.innerText = "SISTEMA EM PAUSA";
            clearInterval(timerInterval);
        }
        renderRoster();
    }

    function generateSecurePix() {
        const modal = document.getElementById('pix-modal');
        const qrContainer = document.getElementById('qrcode');
        const transp = parseFloat(document.getElementById('inp-transp').value) || 0;
        const totalValue = (((seconds / 3600) * 45) + transp).toFixed(2);
        
        qrContainer.innerHTML = "";

        const pixKey = currentUser.pix.trim();
        const merchantName = "X-PARTNER";
        const merchantCity = "BRASILIA";
        
        const gui = "0014BR.GOV.BCB.PIX";
        const keyField = "01" + pixKey.length.toString().padStart(2, '0') + pixKey;
        const merchantAccountInfo = "26" + (gui.length + keyField.length).toString().padStart(2, '0') + gui + keyField;

        let payload = "000201"; 
        payload += merchantAccountInfo;
        payload += "52040000"; 
        payload += "5303986"; 
        payload += "54" + totalValue.length.toString().padStart(2, '0') + totalValue; 
        payload += "5802BR"; 
        payload += "59" + merchantName.length.toString().padStart(2, '0') + merchantName; 
        payload += "60" + merchantCity.length.toString().padStart(2, '0') + merchantCity; 
        payload += "62070503***"; 
        payload += "6304"; 

        function crc16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
                crc ^= data.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                    else crc <<= 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }

        const finalPayload = payload + crc16(payload);

        new QRCode(qrContainer, {
            text: finalPayload,
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById('pix-details').innerText = `DESTINATÁRIO: ${currentUser.n}\nVALOR TOTAL: R$ ${totalValue}\nCHAVE: ${pixKey}`;
        modal.style.display = 'flex';
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

    setInterval(function() {
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
            document.body.innerHTML = "<h1>VIOLAÇÃO DE SEGURANÇA DETECTADA</h1>";
        }
    }, 1000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-PARTNER | Full Scale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --apple-glass: rgba(255, 255, 255, 0.4);
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --vibrant-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body, html {
            margin: 0; padding: 0; min-height: 100vh; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica;
            background: radial-gradient(circle at top left, #4158D0, #C850C0 46%, #FFCC70 100%);
            background-attachment: fixed;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- TELA DE LOGIN (ESTILO ORIGINAL RESTAURADO) --- */
        #auth-screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(20px);
        }
        .login-card {
            background: var(--apple-glass);
            padding: 50px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.5);
            text-align: center; width: 350px; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        .login-card input {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            margin: 20px 0; text-align: center; font-size: 18px; outline: none;
            box-sizing: border-box;
        }

        /* --- DASHBOARD PRINCIPAL (MANTIDO RESPONSIVO) --- */
        #main-app { 
            display: none; width: 100%; max-width: 1200px; 
            padding: 15px; box-sizing: border-box; 
        }

        .glass-container {
            background: var(--apple-glass);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex; flex-direction: column; 
            padding: 20px; gap: 20px;
            min-height: 85vh;
        }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            flex-wrap: wrap; gap: 10px;
        }
        
        .user-pill {
            background: #FFF; padding: 8px 15px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
        }

        .status-badge {
            background: var(--google-green); color: white;
            padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold;
        }

        .main-content { 
            display: flex; flex-direction: column; gap: 15px; flex: 1; 
        }
        
        @media (min-width: 768px) {
            .main-content { flex-direction: row; }
        }

        .card-finance {
            flex: 1.5; background: #FFF; border-radius: 25px; padding: 25px;
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
        }

        .value-display { 
            font-size: clamp(40px, 8vw, 64px); 
            font-weight: 800; color: #1d1d1f; letter-spacing: -2px; margin: 10px 0;
        }

        .sidebar { 
            flex: 1; background: rgba(255,255,255,0.2); 
            border-radius: 25px; padding: 15px; 
            max-height: 300px; overflow-y: auto; 
        }

        @media (min-width: 768px) {
            .sidebar { max-height: none; }
        }

        .worker-item {
            background: #FFF; margin-bottom: 10px; padding: 12px; border-radius: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .btn-group { display: flex; gap: 10px; margin-top: auto; }
        .btn-main {
            flex: 1; padding: 18px 10px; border-radius: 18px; border: none;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-tesla { background: #000; color: #FFF; }
        .btn-google { background: var(--google-blue); color: #FFF; }

        #pix-modal {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .pix-card {
            background: #FFF; padding: 30px; border-radius: 30px; text-align: center;
            width: 100%; max-width: 320px;
        }
        canvas { max-width: 100%; height: auto !important; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN (VOLTOU AO ORIGINAL) -->
<div id="auth-screen">
    <div class="login-card">
        <h1 style="margin:0; font-size: 24px;">X-PARTNER</h1>
        <p style="font-size: 12px; letter-spacing: 2px;">PAINEL DE OPERAÇÕES</p>
        <input type="tel" id="cpf-input" placeholder="Digite seu CPF">
        <button class="btn-main btn-tesla" style="width: 100%; padding: 20px; font-size: 16px; border-radius: 20px;" onclick="login()">ACESSAR SISTEMA</button>
        <p id="msg-erro" style="color:var(--google-red); font-size:12px; display:none; margin-top:15px">CPF não autorizado.</p>
    </div>
</div>

<!-- DASHBOARD (MANTIDO RESPONSIVO) -->
<div id="main-app">
    <div class="glass-container">
        <div class="header">
            <div class="user-pill">
                <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--vibrant-gradient)"></div>
                <div>
                    <strong id="logged-name" style="font-size: 14px;">---</strong>
                </div>
            </div>
            <div style="text-align: right">
                <div class="status-badge" id="status-label">AGUARDANDO</div>
                <h3 id="clock" style="margin: 2px 0; font-family: monospace;">00:00:00</h3>
            </div>
        </div>

        <div class="main-content">
            <div class="card-finance">
                <span style="color: var(--google-blue); font-size: 12px; font-weight: bold;">TEMPO REAL</span>
                <div class="value-display" id="total-val">R$ 0,000</div>
                <div id="timer" style="font-size: 16px; color: #888; font-weight: bold;">00:00:00 TRABALHADO</div>
                
                <div style="margin-top: 20px; padding: 15px; background: #f5f5f7; border-radius: 15px;">
                    <label style="font-size: 10px; color: #666; font-weight: bold; display: block;">TRANSPORTE (R$)</label>
                    <input type="number" id="inp-transp" value="24.00" style="border:none; background:transparent; font-size:20px; font-weight:bold; text-align:center; width: 80px;">
                </div>
            </div>

            <div class="sidebar" id="roster"></div>
        </div>

        <div class="btn-group">
            <button class="btn-main btn-tesla" id="btn-action" onclick="toggleShift()">INICIAR TURNO</button>
            <button class="btn-main btn-google" onclick="showPix()">PIX</button>
        </div>
    </div>
</div>

<div id="pix-modal">
    <div class="pix-card">
        <h3 style="margin-top:0">Pagamento PIX</h3>
        <div id="qrcode" style="display: flex; justify-content: center; margin: 15px 0;"></div>
        <p id="pix-details" style="font-size: 13px; color: #444; white-space: pre-line;"></p>
        <button class="btn-main btn-tesla" style="width: 100%" onclick="closePix()">FECHAR</button>
    </div>
</div>

<script>
    let seconds = 0, timerInterval = null, isRunning = false;
    let currentUser = null;

    const db = [
        { cpf: "34259998854", nome: "Cristian R.", cargo: "Estrategista", ativo: false },
        { cpf: "04037096102", nome: "Mikaele N.", cargo: "Garçonete", ativo: false },
        { cpf: "12345678900", nome: "Ana Costa", cargo: "Logística", ativo: false }
    ];

    function login() {
        const input = document.getElementById('cpf-input').value.replace(/\D/g, '');
        currentUser = db.find(u => u.cpf === input);
        if(currentUser) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            setTimeout(() => { document.getElementById('main-app').style.opacity = '1'; }, 50);
            document.getElementById('logged-name').innerText = currentUser.nome;
            renderRoster();
        } else {
            document.getElementById('msg-erro').style.display = 'block';
        }
    }

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    function renderRoster() {
        const roster = document.getElementById('roster');
        roster.innerHTML = db.map(p => `
            <div class="worker-item">
                <div style="font-size: 13px;">
                    <strong>${p.nome}</strong><br>
                    <small style="color: #888">${p.cargo}</small>
                </div>
                <div style="width: 10px; height: 10px; border-radius: 50%; background: ${p.ativo ? '#34A853' : '#ddd'}"></div>
            </div>
        `).join('');
    }

    function toggleShift() {
        isRunning = !isRunning;
        const btn = document.getElementById('btn-action');
        const status = document.getElementById('status-label');
        currentUser.ativo = isRunning;
        
        if(isRunning) {
            btn.innerText = "PARAR TURNO"; btn.style.background = "#EA4335";
            status.innerText = "OPERANDO"; status.style.background = "#4285F4";
            timerInterval = setInterval(() => {
                seconds++;
                let val = (seconds / 3600) * 45; 
                document.getElementById('total-val').innerText = `R$ ${val.toLocaleString('pt-BR', {minimumFractionDigits:3})}`;
                const h = Math.floor(seconds/3600).toString().padStart(2,'0');
                const m = Math.floor((seconds%3600)/60).toString().padStart(2,'0');
                const s = (seconds%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${h}:${m}:${s} TRABALHADO`;
            }, 1000);
        } else {
            btn.innerText = "RETOMAR TURNO"; btn.style.background = "#000";
            status.innerText = "PAUSADO"; status.style.background = "#FBBC05";
            clearInterval(timerInterval);
        }
        renderRoster();
    }

    function showPix() {
        const modal = document.getElementById('pix-modal');
        const qrContainer = document.getElementById('qrcode');
        const transp = parseFloat(document.getElementById('inp-transp').value) || 0;
        const total = ((seconds/3600)*45) + transp;

        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
            text: `00020126330014BR.GOV.BCB.PIX0111SUACHAVEAQUI520400005303986540${total.toFixed(2)}5802BR5915SANDXCDD6008BRASILIA62070503***6304`,
            width: 180, height: 180
        });

        document.getElementById('pix-details').innerText = `Total: R$ ${total.toFixed(2)}\nRef: ${currentUser.nome}`;
        modal.style.display = 'flex';
    }

    function closePix() { document.getElementById('pix-modal').style.display = 'none'; }
</script>

</body>
</html>

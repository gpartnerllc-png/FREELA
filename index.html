<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREELA | Operação Full Scale</title>
    <style>
        :root {
            --primary-blue: #0047AB;
            --secondary-blue: #007AFF;
            --gold-orange: #FF9900;
            --alert-yellow: #FFCC00;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-dark: rgba(0, 0, 0, 0.85);
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, "SF Pro Display", sans-serif;
            overflow: hidden; background: #000;
        }

        /* FUNDO FULL SCREEN - IMAGENS LOCAIS OU PLACEHOLDERS MAIS ESTÁVEIS */
        .bg-wrapper {
            position: fixed; inset: 0; z-index: -2;
            background-size: cover; background-position: center;
            background-image: url('https://w.wallhaven.cc/full/8o/wallhaven-8o9m6j.jpg'); /* Fundo fixo mais estável */
            filter: brightness(0.5);
        }

        .overlay-blue {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(135deg, rgba(0, 71, 171, 0.8), rgba(0, 0, 0, 0.6));
        }

        .app-container { width: 100%; height: 100%; position: relative; display: flex; flex-direction: column; }

        /* TELA DE LOGIN 3D+ */
        #auth-screen {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 20px; transition: 0.8s;
        }
        .login-card {
            background: var(--glass); backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 35px;
            padding: 50px 30px; width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* DASHBOARD FULL WIDTH (LOGICA XLOG) */
        #main-app { display: none; height: 100%; overflow-y: auto; padding: 20px; }
        
        .header-xlog {
            background: rgba(0,0,0,0.4); padding: 20px; border-radius: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--gold-orange); margin-bottom: 15px;
        }

        .finance-panel {
            background: #FFF; border-radius: 25px; padding: 25px;
            margin-bottom: 15px; text-align: center;
        }
        .val-total { font-size: 45px; font-weight: 900; color: #000; }

        .transport-bar {
            background: rgba(255,255,255,0.1); border: 1px dashed #FFF;
            padding: 15px; border-radius: 15px; color: #FFF; margin-bottom: 20px;
        }

        .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .roster-item { background: #FFF; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .roster-item.priority { border-left: 5px solid var(--gold-orange); }

        .footer-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 15px; display: flex; gap: 10px; background: rgba(0,0,0,0.7);
        }

        .btn-main {
            flex: 1; padding: 18px; border-radius: 15px; border: none;
            font-weight: 900; cursor: pointer;
        }

        input { width: 100%; padding: 15px; border-radius: 12px; border: none; margin-bottom: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="bg-wrapper"></div>
<div class="overlay-blue"></div>

<div class="app-container">
    
    <div id="auth-screen">
        <div class="login-card">
            <h1 style="color:#FFF; margin:0">FREELA</h1>
            <p style="color:rgba(255,255,255,0.6); font-size: 10px; letter-spacing: 2px;">FREELAS</p>
            <input type="tel" id="cpf-input" placeholder="000.000.000-00">
            <button class="btn-main" style="background: var(--gold-orange); color:#000;" onclick="startApp()">ENTRAR NO SISTEMA</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header-xlog">
            <div style="color:#FFF">
                <small id="display-cpf">ID: 000.***.***-00</small>
                <h3 id="display-nome" style="margin:0; color: var(--gold-orange);">Nome</h3>
            </div>
            <div style="background:var(--gold-orange); padding: 5px 10px; border-radius:8px; font-size:10px; font-weight:bold;">OPERADOR ATIVO</div>
        </div>

        <div class="finance-panel">
            <small style="font-weight:bold; color:#666;">AGREGADO EM TEMPO REAL (CLT+DSR)</small>
            <div class="val-total" id="current-value">R$ 0,00</div>
            <div id="time-worked" style="color:var(--secondary-blue); font-weight:bold;">00:00:00</div>
        </div>

        <div class="transport-bar">
            <small style="display:block; margin-bottom:5px;">VALOR DE TRANSPORTE FIXO (OBRIGATÓRIO)</small>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:bold;">R$</span>
                <input type="number" id="input-transporte" style="margin:0; width: 80px; background:transparent; color:#FFF; border-bottom:1px solid #FFF; border-radius:0;" value="24.00">
            </div>
        </div>

        <div class="roster-grid" id="roster"></div>

        <div class="footer-nav">
            <button class="btn-main" id="btn-shift" onclick="toggleShift()" style="background:#FFF;">INICIAR TURNO</button>
            <button class="btn-main" onclick="gerarPix()" style="background:var(--secondary-blue); color:#FFF;">PIX</button>
        </div>
    </div>
</div>

<script>
    const db = [
        { cpf: "34259998854", nome: "Cristian R.", trans: 24.00, renda: 450 },
        { cpf: "04037096102", nome: "Mikaele N.", trans: 24.00, renda: 0 },
        { cpf: "12345678900", nome: "Ana Costa", trans: 24.00, renda: 0 }
    ];

    let user = null, isWorking = false, sec = 0, timer, totalGeral = 0;

    function startApp() {
        const cpf = document.getElementById('cpf-input').value.replace(/\D/g, '');
        user = db.find(u => u.cpf === cpf);
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('display-nome').innerText = user.nome;
            document.getElementById('display-cpf').innerText = `ID: ${user.cpf}`;
            document.getElementById('input-transporte').value = user.trans.toFixed(2);
            render();
        }
    }

    function render() {
        const roster = document.getElementById('roster');
        roster.innerHTML = db.sort((a,b) => a.renda - b.renda).map(u => `
            <div class="roster-item ${u.renda === 0 ? 'priority' : ''}">
                <div><b>${u.nome}</b><br><small>R$ ${u.renda.toFixed(2)}</small></div>
                <div style="font-size:10px; font-weight:bold;">${u.renda === 0 ? 'PRIORIDADE' : 'DISPONÍVEL'}</div>
            </div>
        `).join('');
    }

    function toggleShift() {
        const btn = document.getElementById('btn-shift');
        if(!isWorking) {
            isWorking = true;
            btn.innerText = "PAUSAR TURNO";
            btn.style.background = "#FF3B30";
            btn.style.color = "#FFF";
            timer = setInterval(() => {
                sec++;
                totalGeral = (sec / 3600) * 45.00;
                document.getElementById('current-value').innerText = `R$ ${totalGeral.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
                const h = Math.floor(sec/3600).toString().padStart(2,'0');
                const m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
                const s = (sec%60).toString().padStart(2,'0');
                document.getElementById('time-worked').innerText = `${h}:${m}:${s}`;
            }, 1000);
        } else {
            isWorking = false;
            btn.innerText = "RETOMAR TURNO";
            btn.style.background = "#FFF";
            btn.style.color = "#000";
            clearInterval(timer);
        }
    }

    function gerarPix() {
        const transp = parseFloat(document.getElementById('input-transporte').value) || 0;
        const totalComTransporte = totalGeral + transp;
        const horas = document.getElementById('time-worked').innerText;

        if(totalGeral <= 0) return alert("Erro: O turno precisa estar em andamento para gerar valores.");

        alert(`PROPOSTA DE PAGAMENTO (SandxCDD)
----------------------------------
Operador: ${user.nome}
Tempo: ${horas}
Ganhos (Hora): R$ ${totalGeral.toFixed(2)}
Transporte: R$ ${transp.toFixed(2)}
----------------------------------
TOTAL A RECEBER: R$ ${totalComTransporte.toFixed(2)}

Gerando QR Code PIX...`);
    }
</script>
</body>
</html>
